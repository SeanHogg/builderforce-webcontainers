name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Typecheck and test are independent, so they run on separate runners side by side
  # instead of one after the other.
  build-test:
    name: ${{ matrix.script }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: [typecheck, test]
    steps:
      - uses: actions/checkout@v7

      # Version is read from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Both legs need it: browser resolves core through core's built dist.
      - name: Build (core then browser)
        run: pnpm build

      - name: ${{ matrix.script }}
        run: pnpm ${{ matrix.script }}
