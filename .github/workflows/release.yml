name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Independent gates, run concurrently; both must pass before anything ships.
      - name: Typecheck and test
        run: |
          pnpm typecheck & typecheck=$!
          pnpm test & tests=$!
          status=0
          wait "$typecheck" || status=1
          wait "$tests" || status=1
          exit "$status"

      # Publishes @seanhogg/builderforce-webcontainers-core, then @seanhogg/builderforce-webcontainers.
      # pnpm resolves `workspace:^` to a real range at pack time. Idempotent: a version
      # npm already has is skipped, so re-running a half-failed release is safe.
      - name: Publish
        run: |
          for dir in packages/core packages/browser; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is already on npm — skipping"
            else
              (cd "$dir" && pnpm publish --access public --no-git-checks)
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
